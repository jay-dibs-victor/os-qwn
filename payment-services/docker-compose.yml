version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payment_backend
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
    env_file:
      - ./backend/.env
    networks:
      - payment-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payment_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - payment-network

networks:
  payment-network:
    driver: bridge
