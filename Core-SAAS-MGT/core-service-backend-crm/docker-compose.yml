  audit-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/audit-service/main.js"]
    ports:
      - '3012:3012'
    environment:
      - NODE_ENV=development
      - PORT=3012
      - POSTGRES_HOST=audit-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=audit
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - audit-db
      - rabbitmq

  loan-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan
    ports:
      - '15443:5432'

  loan-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/loan-service/main.js"]
    ports:
      - '3013:3013'
    environment:
      - NODE_ENV=development
      - PORT=3013
      - POSTGRES_HOST=loan-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loan
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
