    environment:
      - NODE_ENV=development
      - PORT=3005
      - POSTGRES_HOST=accounts-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=accounts
    environment:
      - NODE_ENV=development
      - PORT=3005
      - POSTGRES_HOST=accounts-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=accounts
      - LEDGER_SERVICE_HOST=ledger-service
      - LEDGER_SERVICE_PORT=3003
    depends_on:
      - accounts-db

  customer-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer
    ports:
      - '15444:5432'

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/customer-service/main.js"]
    ports:
      - '3014:3014'
    environment:
      - NODE_ENV=development
      - PORT=3014
      - POSTGRES_HOST=customer-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=customer
    depends_on:
      - customer-db

  payment-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
    ports:
