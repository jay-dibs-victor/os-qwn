  kyc-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kyc
    ports:
      - '15440:5432'

  kyc-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/kyc-service/main.js"]
    ports:
      - '3010:3010'
    environment:
      - NODE_ENV=development
      - PORT=3010
      - POSTGRES_HOST=kyc-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kyc
    depends_on:
      - kyc-db

  compliance-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compliance
    ports:
      - '15441:5432'

  compliance-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/compliance-service/main.js"]
