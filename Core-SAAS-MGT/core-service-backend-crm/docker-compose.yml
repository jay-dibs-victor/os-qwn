      - PORT=3006
      - POSTGRES_HOST=payment-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=payment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ACCOUNTS_SERVICE_HOST=accounts-service
      - ACCOUNTS_SERVICE_PORT=3005
      - LEDGER_SERVICE_HOST=ledger-service
      - LEDGER_SERVICE_PORT=3003
      - WALLET_SERVICE_HOST=wallet-service
      - WALLET_SERVICE_PORT=3015
      - PLATFORM_BANK_ACCOUNT=1234567890
      - PLATFORM_BANK_CODE=044
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM_EMAIL=noreply@queensos.com
      - MAIL_FROM_NAME=Queens OS
    depends_on:
