      - POSTGRES_HOST=ledger-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ledger
      - ACCOUNTS_SERVICE_HOST=accounts-service
      - ACCOUNTS_SERVICE_PORT=3005
      - LEDGER_SERVICE_HOST=ledger-service
