version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
      POSTGRES_DB: banking_db
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '16379:6379'
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - '15673:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "QUEENS_OS_RABBITMQ_SECURE_COOKIE_2026"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=3001
      - RBAC_SERVICE_HOST=rbac-service
      - RBAC_SERVICE_PORT=3002
      - APPROVAL_SERVICE_HOST=approval-service
      - APPROVAL_SERVICE_PORT=3004
      - LEDGER_SERVICE_HOST=ledger-service
      - LEDGER_SERVICE_PORT=3003
      - ACCOUNTS_SERVICE_HOST=accounts-service
      - ACCOUNTS_SERVICE_PORT=3005
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3006
      - BATCH_SERVICE_HOST=batch-service
      - BATCH_SERVICE_PORT=3007
      - REVERSAL_SERVICE_HOST=reversal-service
      - REVERSAL_SERVICE_PORT=3008
      - RETRY_SERVICE_HOST=retry-service
      - RETRY_SERVICE_PORT=3009
      - KYC_SERVICE_HOST=kyc-service
      - KYC_SERVICE_PORT=3010
      - COMPLIANCE_SERVICE_HOST=compliance-service
      - COMPLIANCE_SERVICE_PORT=3011
      - AUDIT_SERVICE_HOST=audit-service
      - AUDIT_SERVICE_PORT=3012
      - LOAN_SERVICE_HOST=loan-service
      - LOAN_SERVICE_PORT=3013
      - CUSTOMER_SERVICE_HOST=customer-service
      - CUSTOMER_SERVICE_PORT=3014
      - OVERDRAFT_SERVICE_HOST=overdraft-service
      - OVERDRAFT_SERVICE_PORT=3016
      - WALLET_SERVICE_HOST=wallet-service
      - WALLET_SERVICE_PORT=3015
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=3017
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    command: ["node", "dist/apps/api-gateway/main.js"]
    depends_on:
      - rabbitmq

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/auth-service/main.js"]
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=banking_user
      - POSTGRES_PASSWORD=banking_password
      - POSTGRES_DB=banking_db
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
      - RABBITMQ_AUTH_QUEUE=auth
      - RBAC_SERVICE_URL=http://rbac-service:3002/rbac
      - JWT_SECRET=super-secret-key-change-me
      - JWT_EXPIRATION=3600
      - SENDGRID_API_KEY=placeholder-for-old-image-validation
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM_EMAIL=noreply@queensos.com
      - MAIL_FROM_NAME=Queens OS
      - WALLET_SERVICE_URL=http://wallet-service:3015
      - PAYMENT_SERVICE_URL=http://payment-service:3006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # ── Google OAuth ───────────────────────────────────────────────────────
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=http://localhost:3001/auth/google/callback
      - FRONTEND_URL=http://localhost:3000
      # ── File Upload (adapter pattern) ──────────────────────────────────────
      # Switch between 'cloudinary' (default) and 's3' (production)
      - UPLOAD_PROVIDER=cloudinary
      # Cloudinary — set your real values here or via .env injection
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-questence}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # AWS S3 — uncomment and set when UPLOAD_PROVIDER=s3
      # - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      # - AWS_S3_REGION=${AWS_S3_REGION:-us-east-1}
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - AWS_S3_PUBLIC_URL=${AWS_S3_PUBLIC_URL}
    depends_on:
      - postgres
      - rabbitmq
      - redis

  rbac-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rbac
    ports:
      - '15439:5432'

  rbac-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/rbac-service/main.js"]
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=development
      - PORT=3002
      - POSTGRES_HOST=rbac-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rbac
    depends_on:
      - rbac-db

  approval-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: approval
    ports:
      - '15433:5432'

  approval-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/approval-service/main.js"]
    ports:
      - '3004:3004'
    environment:
      - NODE_ENV=development
      - PORT=3004
      - POSTGRES_HOST=approval-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=approval
      - RBAC_SERVICE_HOST=rbac-service
      - RBAC_SERVICE_PORT=3002
      - API_GATEWAY_URL=http://api-gateway:3000
    depends_on:
      - approval-db
      - rbac-service

  ledger-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      - '15434:5432'

  ledger-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/ledger-service/main.js"]
    ports:
      - '3003:3003'
    environment:
