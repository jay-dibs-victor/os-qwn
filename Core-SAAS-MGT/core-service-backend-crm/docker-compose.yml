      - PORT=3017
      - POSTGRES_HOST=notification-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notification
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDGRID_API_KEY=SG_placeholder
      - MAIL_FROM_EMAIL=noreply@queensos.com
