  batch-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/batch-service/main.js"]
    ports:
      - '3007:3007'
    environment:
      - NODE_ENV=development
      - PORT=3007
      - port=3007
      - POSTGRES_HOST=batch-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=batch
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=3006
    depends_on:
      - batch-db
      - payment-service
  reversal-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
