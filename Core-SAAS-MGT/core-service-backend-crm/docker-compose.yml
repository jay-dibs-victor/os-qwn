  overdraft-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/overdraft-service/main.js"]
    ports:
      - '3016:3016'
    environment:
      - NODE_ENV=development
      - PORT=3016
      - POSTGRES_HOST=overdraft-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=overdraft
