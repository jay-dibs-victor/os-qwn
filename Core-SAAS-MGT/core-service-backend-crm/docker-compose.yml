    ports:
      - '3009:3009'
    environment:
      - NODE_ENV=development
      - PORT=3009
      - POSTGRES_HOST=retry-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=retry
    depends_on:
