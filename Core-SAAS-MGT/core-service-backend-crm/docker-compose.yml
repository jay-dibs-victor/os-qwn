      - PORT=3015
      - POSTGRES_HOST=wallet-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wallet
      - ACCOUNTS_SERVICE_HOST=accounts-service
      - ACCOUNTS_SERVICE_PORT=3005
      - LEDGER_SERVICE_HOST=ledger-service
      - LEDGER_SERVICE_PORT=3003
      # CASH_GL_ACCOUNT_ID removed — auto-resolved by wallet-service from ledger
      - QCOIN_DEPOSITS_GL_ACCOUNT_ID=22222222-2222-2222-2222-222222222222
    depends_on:
      - wallet-db
      - accounts-service
      - ledger-service

  notification-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification
