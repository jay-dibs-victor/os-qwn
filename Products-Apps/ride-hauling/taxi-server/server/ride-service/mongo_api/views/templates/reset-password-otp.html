<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Reset</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:24px;">
      <div style="background:#ffffff;border-radius:16px;padding:24px;border:1px solid #eee;">
        <h2 style="margin:0 0 8px 0;color:#111;">Password Reset</h2>
        <p style="margin:0 0 16px 0;color:#444;line-height:1.5;">Hello {{username}}, use the code below to reset your password:</p>
        <div style="font-size:28px;letter-spacing:6px;font-weight:800;background:#FFB800;color:#111;border-radius:12px;padding:14px 16px;text-align:center;">
          {{code}}
        </div>
        <p style="margin:16px 0 0 0;color:#666;font-size:12px;line-height:1.5;">If you didn’t request this, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
