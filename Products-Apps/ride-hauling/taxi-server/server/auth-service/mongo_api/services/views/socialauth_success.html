<style type="text/css">
    .success-checkmark-verified {
     width: 80px;
     height: 115px;
     margin: 0 auto;
    
  }
   .success-checkmark-verified .check-icon {
     width: 80px;
     height: 80px;
     position: relative;
     border-radius: 50%;
     box-sizing: content-box;
     border: 4px solid #4caf50;
  }
   .success-checkmark-verified .check-icon::before {
     top: 3px;
     left: -2px;
     width: 30px;
     transform-origin: 100% 50%;
     border-radius: 100px 0 0 100px;
  }
   .success-checkmark-verified .check-icon::after {
     top: 0;
     left: 30px;
     width: 60px;
     transform-origin: 0 50%;
     border-radius: 0 100px 100px 0;
     animation: rotate-circle 4.25s ease-in;
  }
   .success-checkmark-verified .check-icon::before, .success-checkmark-verified .check-icon::after {
     content: '';
     height: 100px;
     position: absolute;
     background: #fff;
     transform: rotate(-45deg);
  }
   .success-checkmark-verified .check-icon .icon-line {
     height: 5px;
     background-color: #4caf50;
     display: block;
     border-radius: 2px;
     position: absolute;
     z-index: 10;
  }
   .success-checkmark-verified .check-icon .icon-line.line-tip {
     top: 46px;
     left: 14px;
     width: 25px;
     transform: rotate(45deg);
     animation: icon-line-tip 0.75s;
  }
   .success-checkmark-verified .check-icon .icon-line.line-long {
     top: 38px;
     right: 8px;
     width: 47px;
     transform: rotate(-45deg);
     animation: icon-line-long 0.75s;
  }
   .success-checkmark-verified .check-icon .icon-circle {
     top: -4px;
     left: -4px;
     z-index: 10;
     width: 80px;
     height: 80px;
     border-radius: 50%;
     position: absolute;
     box-sizing: content-box;
     border: 4px solid rgba(76, 175, 80, .5);
  }
   .success-checkmark-verified .check-icon .icon-fix {
     top: 8px;
     width: 5px;
     left: 26px;
     z-index: 1;
     height: 85px;
     position: absolute;
     transform: rotate(-45deg);
     background-color: #fff;
  }
   @keyframes rotate-circle {
     0% {
       transform: rotate(-45deg);
    }
     5% {
       transform: rotate(-45deg);
    }
     12% {
       transform: rotate(-405deg);
    }
     100% {
       transform: rotate(-405deg);
    }
  }
   @keyframes icon-line-tip {
     0% {
       width: 0;
       left: 1px;
       top: 19px;
    }
     54% {
       width: 0;
       left: 1px;
       top: 19px;
    }
     70% {
       width: 50px;
       left: -8px;
       top: 37px;
    }
     84% {
       width: 17px;
       left: 21px;
       top: 48px;
    }
     100% {
       width: 25px;
       left: 14px;
       top: 45px;
    }
  }
   @keyframes icon-line-long {
     0% {
       width: 0;
       right: 46px;
       top: 54px;
    }
     65% {
       width: 0;
       right: 46px;
       top: 54px;
    }
     84% {
       width: 55px;
       right: 0px;
       top: 35px;
    }
     100% {
       width: 47px;
       right: 8px;
       top: 38px;
    }
  }
   
  </style>
  
  <div class="success-checkmark-verified" style="width: 500;height:300;margin-top:90">
    <input id="email" type="hidden"  value="{{password}}"/>
    <input  id="pass" type="hidden"  value="{{email}}"/>
    <h6 style="margin: 0px auto; font-size: 25;">Please confirm this email belongs to you {{email}}. </h6>
    <br/><br/>
    <h4 style="margin: 0px auto;">Your password is {{password}}</h4>
    <br/> <br/> <br/>
    <a id="confirm" style=" margin-left:200; padding:10;background-color: green;font-size: :10;color:#fff; ">Proceed</a>
  </div>
  
  <script type="text/javascript">

  	document.getElementById("confirm").addEventListener("click",function(e){
  		e.preventDefault();
  		this.disabled=true;
  	
       let loginUrl = "http://localhost:12000:12000/api/v1/auth/login"
       let credentials ={
       	 email: document.getElementById("email").value,
       	 password:document.getElementById("pass").value
       }

        fetch(loginUrl, {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'Access-Control-Allow-Origin': '*',
      },
      mode: 'cors',
      body: JSON.stringify(credentials),
    })
      .then(response => response.json())
      .then(data => {
        if (data.status === 200) {
          
          localStorage.setItem('userToken', JSON.stringify(data.data[0]));
          localStorage.login == 'true';
          localStorage.setItem('userToken', JSON.stringify(data.data[0]));

           window.location.replace("http://localhost:12000/dashboard")
        }else if(data.status==409){
          
          
        }
        else if(data.status==404){
          
        }
         else if(data.status==400){
          console.log(data)
          
          // MessageBoard.displayMsg(data.error );
          //Router.redirect('./');
        }
      })
      .catch(error => {
        console.log(error)
      });

 })

    
  </script>
