version: '3.8'

services:
  user-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Change this to your production API Gateway URL for distributed deployment
        - VITE_API_URL=${PROD_GATEWAY_URL:-http://localhost:12000/api/v1}
    container_name: taxi-user-frontend-standalone
    ports:
      - "${PORT:-4002}:4002"
    environment:
      - PORT=${PORT:-4002}
    restart: unless-stopped
