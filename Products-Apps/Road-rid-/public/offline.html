<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Uber Clone</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050505; color: #f4f4f4; font-family: Inter, system-ui, sans-serif; }
      .offline-container { max-width: 560px; padding: 32px; text-align: center; }
      h1 { margin-bottom: 16px; font-size: 2.4rem; }
      p { color: rgba(244, 244, 244, 0.78); margin-bottom: 24px; }
      a { color: #82c7ff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <h1>You are offline</h1>
      <p>This app is cached for offline use. Reconnect to network access full features and update content.</p>
      <a href="/">Reload Home</a>
    </div>
  </body>
</html>
